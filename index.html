<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Timeplan for sangøkter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <style>
      :root {
        --bg: #fbf6ea;
        --paper-line: rgba(64, 104, 170, 0.09);
        --surface: #fffdf8;
        --surface-2: #f2ead8;
        --ink: #2b2620;
        --muted: #6b6155;
        --faint: #a49985;
        --line: #e4d9c3;
        --edge: #3a332b;
        --shadow: rgba(58, 51, 43, 0.85);
        --accent: #2f4cb3;
        --accent-bg: #e4e9fb;
        --on-accent: #ffffff;
        --margin: #e0605e;
        --marker: #ffd84d;
        --note: #fff3b0;
        --tab-elev: #ffd84d;
        --tab-laerer: #ffb3c7;
        --tab-admin: #a8d8ff;
        --danger: #b3261e;
        --ok: #2e7d32;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Mørk modus: tavle */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e2a26;
          --paper-line: rgba(255, 255, 255, 0.035);
          --surface: #263530;
          --surface-2: #2e3e38;
          --ink: #eef1e8;
          --muted: #b6c0b5;
          --faint: #7f8c84;
          --line: #3c4d46;
          --edge: #c9d2c6;
          --shadow: rgba(0, 0, 0, 0.45);
          --accent: #f5d76e;
          --accent-bg: #3b3f2a;
          --on-accent: #1e2a26;
          --margin: #e88a88;
          --marker: rgba(245, 215, 110, 0.35);
          --note: #3a3f2b;
          --tab-elev: #f5d76e;
          --tab-laerer: #f2a5ba;
          --tab-admin: #94c9f2;
          --danger: #f4a7a0;
          --ok: #a6dcaa;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(var(--paper-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
        background-size: 24px 24px;
        font:
          15px/1.45 "Nunito",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px 16px 56px;
      }

      /* ---------- topp ---------- */
      .masthead {
        position: relative;
        margin-bottom: 18px;
      }
      .kicker {
        font: 700 13px/1 "Baloo Thambi 2", sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--margin);
        margin-bottom: 4px;
      }
      h1 {
        font: 800 clamp(28px, 6vw, 40px) / 1.05 "Baloo Thambi 2", sans-serif;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      h1 .hl {
        background: linear-gradient(
          transparent 42%,
          var(--marker) 42%,
          var(--marker) 80%,
          transparent 80%
        );
        padding: 0 4px;
        margin: 0 -4px;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }
      .notes {
        position: absolute;
        right: 4px;
        top: -4px;
        font: 700 34px/1 "Baloo Thambi 2", sans-serif;
        pointer-events: none;
        user-select: none;
      }
      .notes span {
        display: inline-block;
        margin-left: 6px;
      }
      .notes span:nth-child(1) {
        color: var(--accent);
        transform: rotate(-12deg) translateY(10px);
      }
      .notes span:nth-child(2) {
        color: var(--margin);
        transform: rotate(8deg);
        font-size: 44px;
      }
      .notes span:nth-child(3) {
        color: var(--tab-laerer);
        transform: rotate(-6deg) translateY(16px);
      }
      @media (max-width: 560px) {
        .notes {
          display: none;
        }
      }

      /* ---------- knapper og felt ---------- */
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: var(--surface);
        border: 2px solid var(--edge);
        border-radius: 10px;
        padding: 5px 12px;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 2px 2px 0 var(--shadow);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      button:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--shadow);
      }
      button:active {
        transform: translate(1px, 1px);
        box-shadow: 0 0 0 var(--shadow);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      .slot:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      button.primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      input,
      select {
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 14px;
        min-width: 0;
      }
      input:focus,
      select:focus {
        border-color: var(--edge);
      }
      label {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      /* Modusvelger som skilleark i en perm */
      .seg {
        display: flex;
        gap: 6px;
        margin-bottom: -2px;
        padding-left: 10px;
        position: relative;
        z-index: 1;
      }
      .seg button {
        flex: 0 1 140px;
        border-radius: 12px 12px 0 0;
        border-bottom: none;
        padding: 8px 12px 6px;
        font: 700 16px/1.2 "Baloo Thambi 2", sans-serif;
        background: var(--surface-2);
        color: var(--muted);
        box-shadow: none;
        transform: translateY(4px);
      }
      .seg button:hover {
        transform: translateY(1px);
        box-shadow: none;
      }
      .seg button[aria-pressed="true"] {
        transform: none;
        color: #2b2620;
      }
      .seg button[data-mode="elev"][aria-pressed="true"] {
        background: var(--tab-elev);
      }
      .seg button[data-mode="laerer"][aria-pressed="true"] {
        background: var(--tab-laerer);
      }
      .seg button[data-mode="admin"][aria-pressed="true"] {
        background: var(--tab-admin);
      }
      .seg .ico {
        margin-right: 4px;
      }

      .panel {
        background: var(--surface);
        border: 2px solid var(--edge);
        border-radius: 14px;
        padding: 14px 14px 8px;
        margin-bottom: 16px;
        box-shadow: 4px 4px 0 var(--shadow);
      }
      .panel:empty {
        display: none;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
        margin-bottom: 9px;
      }
      .teacher-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        padding: 4px 13px 4px 6px;
      }
      .teacher-btn[aria-pressed="true"] {
        background: var(--tbg);
        color: var(--tfg);
        border-color: var(--tfg);
      }
      .teacher-btn.off {
        color: var(--faint);
        border-color: var(--line);
        box-shadow: none;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--tfg);
        display: inline-block;
        flex: none;
        border: 2px solid var(--surface);
        box-shadow: 0 0 0 1.5px var(--tfg);
      }
      .chip {
        border-radius: 999px;
        padding: 3px 12px;
        font-size: 13px;
        color: var(--muted);
        border-width: 1.5px;
        border-color: var(--line);
        box-shadow: none;
      }
      .chip:hover {
        box-shadow: 2px 2px 0 var(--line);
      }
      .chip[aria-pressed="true"] {
        background: var(--tbg, var(--accent-bg));
        color: var(--tfg, var(--accent));
        border-color: var(--tfg, var(--accent));
        box-shadow: 2px 2px 0 var(--tfg, var(--accent));
      }
      .label {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-right: 2px;
      }
      .inline-form {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 8px;
      }
      .inline-form input {
        flex: 1 1 160px;
      }

      details.admin {
        background: var(--surface-2);
        border: 2px dashed var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      details.admin[open] {
        border-style: solid;
        background: var(--surface);
      }
      details.admin summary {
        cursor: pointer;
        font: 700 16px/1.3 "Baloo Thambi 2", sans-serif;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 10px;
        align-items: end;
      }
      .weekdays {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .weekdays label {
        flex-direction: row;
        align-items: center;
        gap: 3px;
        color: var(--ink);
      }

      .months {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 12px;
      }
      .filterbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        min-height: 34px;
        margin-bottom: 14px;
      }
      .msg {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }
      #msg:not(:empty) {
        background: var(--note);
        color: var(--ink);
        padding: 7px 12px;
        border-radius: 4px 12px 12px 12px;
        box-shadow: 2px 2px 0 var(--line);
        font-weight: 600;
      }
      #msg.err {
        color: var(--danger);
      }
      #msg.ok {
        color: var(--ok);
      }

      /* ---------- timeplanen: et ark teipet fast ---------- */
      .sheet {
        position: relative;
        background: var(--surface);
        border: 2px solid var(--edge);
        border-radius: 16px;
        box-shadow: 5px 5px 0 var(--shadow);
      }
      .sheet::before,
      .sheet::after {
        content: "";
        position: absolute;
        top: -11px;
        width: 86px;
        height: 22px;
        background: var(--marker);
        opacity: 0.75;
        z-index: 4;
      }
      .sheet::before {
        left: 22px;
        transform: rotate(-4deg);
      }
      .sheet::after {
        right: 22px;
        transform: rotate(3deg);
      }
      .gridwrap {
        overflow-x: auto;
        border-radius: 0 0 14px 14px;
      }
      /* Steder og måned følger med når man scroller nedover */
      .sticky-head {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 3;
        background: var(--surface);
        border-radius: 14px 14px 0 0;
        box-shadow: 0 2px 0 var(--line);
      }
      .sticky-head[hidden] {
        display: none;
      }
      .sticky-head + .gridwrap {
        border-radius: 0 0 14px 14px;
      }
      .headwrap {
        overflow: hidden;
        border-radius: 14px 14px 0 0;
      }
      .grid {
        min-width: max-content;
        padding: 6px 14px 10px 10px;
        /* rød marglinje etter dagkolonnen */
        background: linear-gradient(
            90deg,
            transparent 79px,
            var(--margin) 79px,
            var(--margin) 81px,
            transparent 81px
          )
          no-repeat;
      }
      .grid > .msg {
        padding: 18px 0 18px 86px;
      }
      .gr {
        display: grid;
        gap: 8px;
        align-items: start;
      }
      .colhead {
        padding: 12px 14px 8px 10px;
        align-items: center;
      }
      .colhead .corner {
        position: sticky;
        left: 4px;
        z-index: 1;
        background: var(--surface);
        box-shadow: 0 0 0 8px var(--surface);
        width: 56px;
        text-align: center;
        line-height: 1.05;
      }
      .colhead .corner b {
        display: block;
        font: 800 17px/1 "Baloo Thambi 2", sans-serif;
        text-transform: uppercase;
        color: var(--margin);
      }
      .colhead .corner span {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
      }
      .colhead .loc {
        text-align: center;
        font: 700 16px/1.2 "Baloo Thambi 2", sans-serif;
        background: var(--accent-bg);
        color: var(--accent);
        border-radius: 10px;
        padding: 7px 6px 5px;
        margin-left: 6px;
      }
      .month-h {
        width: fit-content;
        font: 800 24px/1.1 "Baloo Thambi 2", sans-serif;
        margin: 22px 0 2px 86px;
        text-transform: capitalize;
        background: linear-gradient(
          transparent 42%,
          var(--marker) 42%,
          var(--marker) 82%,
          transparent 82%
        );
        padding: 0 6px;
        transform: rotate(-1deg);
      }
      .week-h {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 14px 0 8px 86px;
        padding-top: 8px;
        border-top: 2px dashed var(--line);
      }
      .week-h b {
        display: inline-block;
        background: var(--edge);
        color: var(--surface);
        border-radius: 999px;
        padding: 0 9px;
        margin-right: 6px;
        font-weight: 800;
      }
      /* Dagen som et lite rivekalenderark */
      .day {
        width: 56px;
        text-align: center;
        background: var(--surface);
        border: 2px solid var(--edge);
        border-radius: 9px;
        overflow: hidden;
        line-height: 1.2;
        /* følger med til venstre når timeplanen scrolles sidelengs */
        position: sticky;
        left: 4px;
        z-index: 1;
        box-shadow:
          2px 2px 0 var(--shadow),
          0 0 0 8px var(--surface);
      }
      .day b {
        display: block;
        background: var(--margin);
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 2px 0 1px;
      }
      .day span {
        display: block;
        font: 800 15px/1.4 "Baloo Thambi 2", sans-serif;
        padding: 2px 0 0;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 0 8px 6px;
      }
      .empty-cell {
        text-align: center;
        color: var(--faint);
        font-size: 13px;
        padding-top: 12px;
      }

      /* Økter som kartotekkort */
      .slot {
        border: 2px solid var(--edge);
        border-radius: 10px;
        overflow: hidden;
        background: var(--surface);
        font-size: 13px;
        padding-bottom: 4px;
        box-shadow: 2px 2px 0 var(--shadow);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .slot.free {
        border: 2px dashed var(--faint);
        background: transparent;
        box-shadow: none;
        text-align: center;
        color: var(--muted);
        padding: 5px 4px;
        font-weight: 700;
      }
      .slot.clickable {
        cursor: pointer;
      }
      .slot.clickable:hover {
        transform: translate(-1px, -2px) rotate(-0.8deg);
        box-shadow: 3px 4px 0 var(--shadow);
      }
      .slot.free.clickable:hover {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: none;
      }
      .slot .tm {
        padding: 3px 8px 2px;
        font: 700 13px/1.3 "Baloo Thambi 2", sans-serif;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        margin-bottom: 4px;
      }
      .slot .song {
        display: block;
        margin: 0 5px 3px;
        padding: 2px 7px 2px 6px;
        border-radius: 3px 8px 8px 3px;
        border-left: 4px solid var(--tfg);
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--tbg);
        color: var(--tfg);
      }
      .slot .song::before {
        content: "♪ ";
        opacity: 0.7;
      }
      .slot .add {
        display: block;
        margin: 4px 5px 0;
        padding: 2px 7px;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        border: 1.5px dashed var(--line);
        border-radius: 8px;
        text-align: center;
      }
      .slot.clickable:hover .add {
        color: var(--accent);
        border-color: var(--accent);
      }
      .slot.everyone {
        background: var(--accent-bg);
        border-style: double;
        border-width: 4px;
        text-align: center;
      }
      .slot.everyone .all {
        display: block;
        font: 800 14px/1.2 "Baloo Thambi 2", sans-serif;
        color: var(--accent);
      }
      .slot.everyone .all::before {
        content: "♫ ";
      }
      .slot.everyone .who {
        display: block;
        padding: 0 5px;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }
      .slot .song.dim {
        background: var(--surface-2);
        color: var(--faint);
        border-left-color: var(--line);
        font-weight: 600;
      }
      .notice {
        background: var(--note);
        border: 2px solid var(--edge);
        border-radius: 12px;
        padding: 16px;
        margin: 4px 0 4px 86px;
      }
      .notice code {
        font-size: 13px;
      }
      @media (max-width: 560px) {
        .grid {
          background-position: -8px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button,
        .slot {
          transition: none;
        }
        button:hover,
        button:active,
        .slot.clickable:hover {
          transform: none;
        }
      }

      /* Lærerfarger: lys og mørk variant */
      .c-aqua {
        --tbg: #d6f0ec;
        --tfg: #0d5c54;
      }
      .c-violet {
        --tbg: #e8e2f8;
        --tfg: #4b3a8c;
      }
      .c-orange {
        --tbg: #fbe5d3;
        --tfg: #8a4210;
      }
      .c-magenta {
        --tbg: #f7dcea;
        --tfg: #8c1f5a;
      }
      .c-blue {
        --tbg: #dce8f8;
        --tfg: #1f4f8c;
      }
      .c-green {
        --tbg: #dff0d8;
        --tfg: #2f6a1f;
      }
      .c-red {
        --tbg: #f8dcdc;
        --tfg: #8c2020;
      }
      .c-yellow {
        --tbg: #f6edc8;
        --tfg: #6b5410;
      }
      @media (prefers-color-scheme: dark) {
        .c-aqua {
          --tbg: #173f3b;
          --tfg: #8fd8cd;
        }
        .c-violet {
          --tbg: #2e2650;
          --tfg: #c3b6f2;
        }
        .c-orange {
          --tbg: #4a2a14;
          --tfg: #f2b88a;
        }
        .c-magenta {
          --tbg: #4a1d36;
          --tfg: #efa6cb;
        }
        .c-blue {
          --tbg: #1c2f4d;
          --tfg: #a5c4ef;
        }
        .c-green {
          --tbg: #22381b;
          --tfg: #a9d897;
        }
        .c-red {
          --tbg: #4a1e1e;
          --tfg: #efa3a3;
        }
        .c-yellow {
          --tbg: #3f3514;
          --tfg: #e8d48a;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="masthead">
        <div class="notes" aria-hidden="true">
          <span>♪</span><span>♫</span><span>♪</span>
        </div>
        <div class="kicker">Øvingsplan</div>
        <h1><span class="hl">Timeplan</span> for sangøkter</h1>
        <p class="sub" id="sub">Laster timeplanen …</p>
      </header>
      <div class="seg" id="modes">
        <button data-mode="elev">
          <span class="ico" aria-hidden="true">🎒</span>Elev
        </button>
        <button data-mode="laerer">
          <span class="ico" aria-hidden="true">🎵</span>Lærer
        </button>
        <button data-mode="admin">
          <span class="ico" aria-hidden="true">🗂️</span>Admin
        </button>
      </div>
      <section class="panel" id="panel"></section>
      <div class="months" id="months"></div>
      <div class="filterbar">
        <p class="msg" id="msg"></p>
        <button id="clear" hidden>Vis alle sanger</button>
      </div>
      <div class="sheet">
        <div class="sticky-head" id="stickyhead" hidden>
          <div class="headwrap" id="headwrap"></div>
        </div>
        <div class="gridwrap" id="gridwrap">
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </main>

    <script>
      // ---------------------------------------------------------------
      // Konfigurasjon: fyll inn fra Supabase → Project Settings → API
      // ---------------------------------------------------------------
      const SUPABASE_URL = "https://oyftodvtqttwrhdlztvj.supabase.co";

      const state = {

      let db;

      // ---------- små hjelpere ----------
      function el(tag, props = {}, ...kids) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (v === false || v == null) continue;
          if (k === "class") e.className = v;
          else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v === true ? "" : v);
        }
        for (const c of kids.flat()) {
          if (c == null || c === false) continue;
          e.append(c instanceof Node ? c : document.createTextNode(String(c)));
        }
        return e;
      }
      async function rpc(name, args) {
        const { data, error } = await db.rpc(name, args);
        if (error) throw new Error(error.message);
        return data;
      }
      function say(text, kind = "") {
        state.msg = text;
        state.msgKind = kind;
      }
      function parseDate(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function fmtDate(s) {
        const d = parseDate(s);
        return (
          String(d.getDate()).padStart(2, "0") +
          "." +
          String(d.getMonth() + 1).padStart(2, "0")
        );
      }
      function weekKey(s) {
        const d = parseDate(s);
        d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      function isoWeek(s) {
        const d = parseDate(s);
        d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
        const jan4 = new Date(d.getFullYear(), 0, 4);
        return (
          1 +
          Math.round(
            ((d - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7,
          )
        );
      }
      function monthLabel(key, short) {
        const [y, m] = key.split("-").map(Number);
        return short ? MONTH_SHORT[m - 1] + " " + y : MONTH[m - 1] + " " + y;
      }
      const teacherById = (id) => state.teachers.find((t) => t.id === id);
      const songById = (id) => state.songs.find((s) => s.id === id);
      const colorClass = (t) =>
        "c-" + (COLORS.includes(t?.color) ? t.color : "blue");

      // ---------- data ----------
      async function load() {
        const [t, l, s] = await Promise.all([
          db
            .from("teacher")
            .select("id, name, color, song(id, title)")
            .order("id"),
          db.from("location").select("id, name").order("id"),
          db
            .from("slot")
            .select(
              "id, date, start_time, end_time, location_id, everyone, assignment(song_id)",
            )
            .order("date")
            .order("start_time"),
        ]);
        const err = t.error || l.error || s.error;
        if (err) throw new Error(err.message);

        state.teachers = t.data.map((x) => ({
          id: x.id,
          name: x.name,
          color: x.color,
        }));
        state.songs = t.data.flatMap((x) =>
          x.song
            .sort((a, b) => a.id - b.id)
            .map((sg) => ({ id: sg.id, title: sg.title, teacher_id: x.id })),
        );
        state.locations = l.data;
        state.slots = s.data.map((x) => ({
          id: x.id,
          date: x.date,
          start: x.start_time.slice(0, 5),
          end: x.end_time.slice(0, 5),
          location_id: x.location_id,
          everyone: x.everyone,
          songs: x.everyone ? [] : x.assignment.map((a) => a.song_id),
        }));
        state.months = [
          ...new Set(state.slots.map((x) => x.date.slice(0, 7))),
        ].sort();

        for (const id of [...state.selSongs])
          if (!songById(id)) state.selSongs.delete(id);
        if (state.actSong && !songById(state.actSong)) state.actSong = null;
      }

      let reloadTimer;
      function scheduleReload() {
        clearTimeout(reloadTimer);
        reloadTimer = setTimeout(async () => {
          try {
            await load();
            render();
          } catch (e) {
            console.error(e);
          }
        }, 400);
      }

      // ---------- URL ----------
      function readUrl() {
        const p = new URLSearchParams(window.location.search);
        const m = p.get("maned"),
          s = p.get("sang");
        if (m) m.split(",").forEach((x) => state.selMonths.add(x));
        if (s)
          s.split(",")
            .map(Number)
            .filter(Boolean)
            .forEach((x) => state.selSongs.add(x));
        return Boolean(m);
      }
      function writeUrl() {
        const p = new URLSearchParams();
        if (state.selMonths.size)
          p.set("maned", [...state.selMonths].sort().join(","));
        if (state.selSongs.size) p.set("sang", [...state.selSongs].join(","));
        const qs = p.toString().replace(/%2C/g, ",");
        history.replaceState(
          null,
          "",
          window.location.pathname + (qs ? "?" + qs : ""),
        );
      }
      function defaultMonths() {
        const now = new Date();
        const cur =
          now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
        const upcoming = state.months.filter((m) => m >= cur);
        if (upcoming.length && upcoming.length < state.months.length)
          upcoming.forEach((m) => state.selMonths.add(m));
      }

      // ---------- filtrering ----------
      function slotVisible(x) {
        if (state.selMonths.size && !state.selMonths.has(x.date.slice(0, 7)))
          return false;
        if (
          state.mode === "elev" &&
          state.selSongs.size &&
          !x.everyone &&
          !x.songs.some((id) => state.selSongs.has(id))
        )
          return false;
        return true;
      }

              "div",
              { class: "inline-form" },

              el("button", { onclick: addSong }, "Legg til sang"),

      function adminSlots() {
        const loc = el(
          "select",
          {},
          state.locations.map((l) => el("option", { value: l.id }, l.name)),
        );
        const from = el("input", { type: "date" }),
          to = el("input", { type: "date" });
        const start = el("input", { type: "time", value: "11:00" }),
          end = el("input", { type: "time", value: "13:00" });
        const days = [1, 2, 3, 4, 5, 6, 7].map((n) =>
          el("input", { type: "checkbox", value: n }),
        );
        const names = ["Man", "Tir", "Ons", "Tor", "Fre", "Lør", "Søn"];
        const everyone = el("input", { type: "checkbox" });
        const submit = async () => {
          const wd = days.filter((d) => d.checked).map((d) => Number(d.value));
          if (!from.value || !wd.length) {
            say("Velg minst fra-dato og én ukedag.", "err");
            render();
            return;
          }
          try {
            const n = await rpc("create_slots", {
              p_location_id: Number(loc.value),
              p_from: from.value,
              p_to: to.value || from.value,
              p_weekdays: wd,
              p_start: start.value,
              p_end: end.value,
              p_everyone: everyone.checked,
            });
            await load();
            say(`La til ${n} økter.`, "ok");
          } catch (e) {
            say(e.message, "err");
          }
          render();
        };
        return el(
          "details",
          { class: "admin" },
          el("summary", {}, "Legg til økter"),
          el(
            "div",
            { class: "form-grid" },
            el("label", {}, "Sted", loc),
            el("label", {}, "Fra dato", from),
            el("label", {}, "Til dato (tom = én dag)", to),

          el(
            "div",
            { class: "form-grid" },
            el(
              "div",
              { class: "weekdays" },

            el(

            el(
              "button",
              { class: "primary", onclick: submit },
              "Legg til økter",
            ),
          ),
        );

      function renderGrid() {
        const g = document.getElementById("grid");
        const hw = document.getElementById("headwrap");
        g.replaceChildren();
        hw.replaceChildren();
        document.getElementById("stickyhead").hidden = true;
        const cols = `64px repeat(${state.locations.length}, minmax(110px, 1fr))`;
        const visible = state.slots.filter(slotVisible);

        if (!state.locations.length) {
          g.append(
            el(
              "p",
              { class: "msg" },
              "Ingen steder er lagt inn ennå. Legg til et sted i Admin.",
            ),
          );
          return;
        }
        if (!visible.length) {
          g.append(
            el(
              "p",
              { class: "msg" },
              state.slots.length
                ? "Ingen økter passer filteret. Velg flere måneder eller sanger."
                : "Ingen økter er lagt inn ennå. Legg til økter i Admin.",
            ),
          );
          return;
        }

        hw.append(
          el(
            "div",
            { class: "gr colhead", style: "grid-template-columns:" + cols },
            el("div", { class: "corner", id: "curmonth" }),
            state.locations.map((l) => el("div", { class: "loc" }, l.name)),
          ),
        );
        document.getElementById("stickyhead").hidden = false;

        const dates = [...new Set(visible.map((x) => x.date))].sort();
        const showMonthHeads =
          new Set(dates.map((d) => d.slice(0, 7))).size > 1;
        let curMonth = null,
          curWeek = null;

        for (let i = 0; i < dates.length; i++) {
          const d = dates[i];
          const m = d.slice(0, 7),
            w = weekKey(d);
          if (m !== curMonth) {
            curMonth = m;
            curWeek = null;
            if (showMonthHeads)
              g.append(el("div", { class: "month-h" }, monthLabel(m, false)));
          }
          if (w !== curWeek) {
            curWeek = w;
            const inWeek = dates.filter(
              (x) => weekKey(x) === w && x.slice(0, 7) === m,
            );
            const label =
              inWeek.length > 1
                ? fmtDate(inWeek[0]) + "–" + fmtDate(inWeek[inWeek.length - 1])
                : fmtDate(inWeek[0]);
            g.append(
              el(
                "div",
                { class: "week-h" },
                el("b", {}, "Uke " + isoWeek(inWeek[0])),
                label,
              ),
            );
          }
          const row = el(
            "div",
            {
              class: "gr",
              style: "grid-template-columns:" + cols,
              "data-month": m,
            },
            el(
              "div",
              { class: "day" },
              el("b", {}, DAY[parseDate(d).getDay()]),
              " ",
              el("span", {}, fmtDate(d)),
            ),
          );
          for (const l of state.locations) {
            const xs = visible.filter(
              (x) => x.date === d && x.location_id === l.id,
            );
            row.append(
              el(
                "div",
                { class: "cell" },
                xs.length
                  ? xs.map(slotBlock)
                  : el("div", { class: "empty-cell" }, "·"),
              ),
            );
          }
          g.append(row);
        }
        syncHead();
      }

      // Holder den faste overskriften like bred som timeplanen, scrollet likt
      // sidelengs, og med riktig måned i hjørnet.
      function syncHead() {
        const head = document.querySelector("#headwrap .colhead");
        if (!head) return;
        head.style.width = document.getElementById("grid").offsetWidth + "px";
        document.getElementById("headwrap").scrollLeft =
          document.getElementById("gridwrap").scrollLeft;
        updateMonth();
      }
      function updateMonth() {
        const corner = document.getElementById("curmonth");
        if (!corner) return;
        const top = document
          .getElementById("headwrap")
          .getBoundingClientRect().bottom;
        const rows = document.querySelectorAll("#grid .gr[data-month]");
        let m = rows.length ? rows[rows.length - 1].dataset.month : null;
        for (const r of rows)
          if (r.getBoundingClientRect().bottom > top) {
            m = r.dataset.month;
            break;
          }
        if (!m || corner.dataset.month === m) return;
        corner.dataset.month = m;
        const [y, mo] = m.split("-").map(Number);
        corner.replaceChildren(
          el("b", {}, MONTH_SHORT[mo - 1]),
          el("span", {}, y),
        );
        corner.title = monthLabel(m, false);
      }

      function slotBlock(x) {
        if (x.everyone) return everyoneBlock(x);
        const teacher = state.mode === "laerer" && state.actSong;
        const admin = state.mode === "admin";
        const clickable = Boolean(teacher || admin);
        const songs = x.songs
          .map(songById)
          .filter(Boolean)
          .sort(
            (a, b) =>
              state.teachers.findIndex((t) => t.id === a.teacher_id) -
                state.teachers.findIndex((t) => t.id === b.teacher_id) ||
              a.id - b.id,
          );

        const props = {
          class:
            "slot" +
            (songs.length ? "" : " free") +
            (clickable ? " clickable" : ""),
        };
        if (clickable) {
          props.tabindex = "0";
          props.role = "button";
          props.onclick = () => (admin ? deleteSlot(x) : toggleSong(x));
          props.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              props.onclick();
            }
          };
        }
        const canAdd = teacher && !x.songs.includes(state.actSong);
        if (teacher)
          props["aria-label"] =
            `${x.start}–${x.end}: ` +
            (canAdd ? "legg til" : "fjern") +
            ` «${songById(state.actSong)?.title}»`;
        if (!songs.length)
          return el(
            "div",
            props,
            x.start + "–" + x.end,
            el("br"),
            teacher ? "+ Legg til" : "Ledig",
          );
        return el(
          "div",
          props,
          el("div", { class: "tm" }, x.start + "–" + x.end),
          songs.map((s) => {
            const t = teacherById(s.teacher_id);
            const dim =
              state.mode === "elev" &&
              state.selSongs.size &&
              !state.selSongs.has(s.id);
            return el(
              "span",
              {
                class: "song " + colorClass(t) + (dim ? " dim" : ""),
                title: s.title + " – " + (t?.name ?? ""),
              },
              s.title,
            );
          }),
          canAdd && el("span", { class: "add" }, "+ Legg til"),
        );
      }

      // Fellesøving: forhåndsutfylt for alle, lærere kan ikke legge inn sanger
      function everyoneBlock(x) {
        const admin = state.mode === "admin";
        const props = {
          class: "slot everyone" + (admin ? " clickable" : ""),
          title: "Alle lærere øver alle sanger",
        };
        if (admin) {
          props.tabindex = "0";
          props.role = "button";
          props.onclick = () => deleteSlot(x);
          props.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              deleteSlot(x);
            }
          };
        }
        return el(
          "div",
          props,
          el("div", { class: "tm" }, x.start + "–" + x.end),
          el("span", { class: "all" }, "Fellesøving"),
          el("span", { class: "who" }, "Alle lærere · alle sanger"),
        );
      }

      async function toggleSong(x) {
        const has = x.songs.includes(state.actSong);
        try {
          await rpc(has ? "unassign_song" : "assign_song", {
            p_slot_id: x.id,
            p_song_id: state.actSong,
          });
          if (has) x.songs = x.songs.filter((id) => id !== state.actSong);
          else x.songs.push(state.actSong);
        } catch (e) {
          say(e.message, "err");
        }
        render();
      }

      async function deleteSlot(x) {
        const loc =
          state.locations.find((l) => l.id === x.location_id)?.name ?? "";
        const extra = x.songs.length
          ? ` Den har ${x.songs.length} sang(er) som også fjernes.`
          : "";
        if (
          !confirm(
            `Slette økten ${loc} ${fmtDate(x.date)} ${x.start}–${x.end}?${extra}`,
          )
        )
          return;
        try {
          await rpc("delete_slot", {
            p_slot_id: x.id,
          });
          await load();
          say("Økten er slettet.", "ok");
        } catch (e) {
          say(e.message, "err");
        }
        render();
      }

      // ---------- oppstart ----------
      document.querySelectorAll("#modes button").forEach((b) =>
        b.addEventListener("click", () => {
          state.mode = b.dataset.mode;
          render();
        }),
      );
      let monthFrame = 0;
      window.addEventListener(
        "scroll",
        () => {
          cancelAnimationFrame(monthFrame);
          monthFrame = requestAnimationFrame(updateMonth);
        },
        { passive: true },
      );
      window.addEventListener("resize", syncHead);
      document.getElementById("gridwrap").addEventListener(
        "scroll",
        (e) => {
          document.getElementById("headwrap").scrollLeft = e.target.scrollLeft;
        },
        { passive: true },
      );
      document.getElementById("clear").addEventListener("click", () => {
        state.selSongs.clear();
        render();
      });

      (async function start() {
        if (
          SUPABASE_URL.includes("your-project") ||
          SUPABASE_ANON_KEY === "your-anon-key"
        ) {
          document.getElementById("sub").textContent = "";
          document
            .getElementById("grid")
            .replaceChildren(
              el(
                "div",
                { class: "notice" },
                el("p", {}, "Siden er ikke koblet til databasen ennå."),
                el(
                  "p",
                  {},
                  "Åpne index.html og fyll inn ",
                  el("code", {}, "SUPABASE_URL"),
                  " og ",
                  el("code", {}, "SUPABASE_ANON_KEY"),
                  " fra Supabase under Project Settings → API.",
                ),
              ),
            );
          return;
        }
        db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const hadMonths = readUrl();
        try {
          await load();
        } catch (e) {
          document.getElementById("sub").textContent = "";
          document
            .getElementById("grid")
            .replaceChildren(
              el(
                "div",
                { class: "notice" },
                el("p", {}, "Fikk ikke lastet timeplanen: " + e.message),
                el(
                  "p",
                  {},
                  "Sjekk at setup.sql er kjørt i Supabase, og at URL og nøkkel stemmer.",
                ),
              ),
            );
          return;
        }
        if (!hadMonths) defaultMonths();
        render();

        db.channel("timeplan")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "assignment" },
            scheduleReload,
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "slot" },
            scheduleReload,
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "song" },
            scheduleReload,
          )
          .subscribe();
      })();
    </script>
  </body>
</html>
